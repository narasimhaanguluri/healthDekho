# Local development profile (active when SPRING_PROFILES_ACTIVE=dev)
# Values are loaded from ../.env (never commit real secrets)

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SQL_INIT_MODE:never}

healthdekho.security.jwt.secret=${JWT_SECRET}
healthdekho.security.jwt.issuer=${JWT_ISSUER}
healthdekho.security.jwt.audience=${JWT_AUDIENCE}

spring.ai.bedrock.aws.region=${AWS_REGION}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_MODEL_ID}

healthdekho.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
