spring.application.name=healthdekho
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/healthDekho}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Supply JWT_SECRET from environment or secret manager as base64-encoded random key material (>= 256 bits).
healthdekho.security.jwt.secret=${JWT_SECRET:ZGV2LWxvY2FsLWRldi1vbmx5LWp3dC1zZWNyZXQta2V5LW1pbmltdW0tMzItYnl0ZXM=}
healthdekho.security.jwt.issuer=${JWT_ISSUER:healthdekho}
healthdekho.security.jwt.audience=${JWT_AUDIENCE:healthdekho-api}

# Spring AI & Amazon Bedrock Converse
spring.ai.model.chat=bedrock-converse
spring.ai.bedrock.aws.region=${AWS_REGION:ap-south-1}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_MODEL_ID:global.anthropic.claude-haiku-4-5-20251001-v1:0}
spring.ai.bedrock.converse.chat.options.temperature=0.3
spring.ai.bedrock.converse.chat.options.max-tokens=1024
